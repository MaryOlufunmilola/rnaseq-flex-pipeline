# conda env create -f environment.yml && conda activate rnaseq-flex
# On Apple Silicon, if a package is not found: CONDA_SUBDIR=osx-64 conda env create -f environment.yml
name: rnaseq-flex
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base=4.4
  - r-here
  - r-dplyr
  - r-tidyr
  - r-tibble
  - r-readr
  - r-ggplot2>=3.5
  - r-ggrepel
  - r-pheatmap
  - r-rcolorbrewer
  - r-scales
  - r-matrixstats
  - r-plotly
  - r-htmlwidgets
  - r-msigdbr
  - r-ashr
  - r-biocmanager
  - bioconductor-deseq2
  - bioconductor-edger
  - bioconductor-tximport
  - bioconductor-summarizedexperiment
  - bioconductor-annotationdbi
  - bioconductor-enhancedvolcano
  - bioconductor-clusterprofiler
  - bioconductor-reactomepa
  - bioconductor-dose
  - bioconductor-org.hs.eg.db
